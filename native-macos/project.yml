name: CrossDashboard

options:
  bundleIdPrefix: com.crossdashboard
  deploymentTarget:
    macOS: "15.0"        # Tracks macOS 26 / Tahoe; bump to "26.0" when SDK ships
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  swift-markdown-ui:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.3.0"
  swift-math:
    url: https://github.com/mgriebling/SwiftMath
    from: "1.7.3"

schemes:
  CrossDashboard:
    build:
      targets:
        CrossDashboard: all
        CrossDashboardKit: [build]
        DashboardWidgetExtension: [build]
        MemosShareExtension: [build]
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:

  CrossDashboardKit:
    type: framework
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - CrossDashboard/Domain/Models.swift
      - CrossDashboard/Data/Persistence/PersistenceController.swift
      - CrossDashboard/Data/Prefs/AppPreferences.swift
      - CrossDashboard/Data/Prefs/KeychainStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crossdashboard.kit
        PRODUCT_NAME: CrossDashboardKit
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MACH_O_TYPE: staticlib
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""

  CrossDashboard:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: CrossDashboard
        excludes:
          - Domain/Models.swift
          - Data/Persistence/PersistenceController.swift
          - Data/Prefs/AppPreferences.swift
          - Data/Prefs/KeychainStore.swift
    info:
      path: CrossDashboard/Info.plist
      properties:
        CFBundleDisplayName: CrossDashboard
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: ""
        NSPrincipalClass: NSApplication
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - crossdashboard
            CFBundleURLName: com.crossdashboard.app
        NSCalendarsUsageDescription: "CrossDashboard accesses your calendars to display events."
        NSRemindersUsageDescription: "CrossDashboard manages your tasks."
        com.apple.developer.networking.wifi-info: false
        NSServices:
          - NSMenuItem:
              default: "Capture to Memos"
            NSMessage: captureToMemos
            NSPortName: CrossDashboard
            NSSendTypes:
              - public.utf8-plain-text
              - NSStringPboardType
              - public.url
    entitlements:
      path: CrossDashboard/CrossDashboard.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.keychain-access-groups:
          - "$(AppIdentifierPrefix)com.crossdashboard.app"
        com.apple.application-identifier: "$(AppIdentifierPrefix)com.crossdashboard.app"
        com.apple.security.application-groups:
          - group.com.crossdashboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crossdashboard.app
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - target: CrossDashboardKit
        embed: false
      - package: swift-markdown-ui
        product: MarkdownUI
      - package: swift-math
        product: SwiftMath
      - target: MemosShareExtension
        embed: true

  MemosShareExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - MemosShareExtension
    info:
      path: MemosShareExtension/Info.plist
      properties:
        CFBundleDisplayName: MemosShareExtension
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: 1
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 10
    entitlements:
      path: MemosShareExtension/MemosShareExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.application-groups:
          - group.com.crossdashboard
        com.apple.security.keychain-access-groups:
          - "$(AppIdentifierPrefix)com.crossdashboard.app"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crossdashboard.app.shareextension
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - target: CrossDashboardKit
        embed: false

  DashboardWidgetExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - DashboardWidgetExtension
    info:
      path: DashboardWidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: DashboardWidget
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: DashboardWidgetExtension/DashboardWidgetExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.com.crossdashboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crossdashboard.app.widget
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: CrossDashboardKit
        embed: false
