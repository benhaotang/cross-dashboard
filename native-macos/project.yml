name: CrossDashboard

options:
  bundleIdPrefix: com.crossdashboard
  deploymentTarget:
    macOS: "15.0"        # Tracks macOS 26 / Tahoe; bump to "26.0" when SDK ships
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    CURRENT_PROJECT_VERSION: 20606
    DEVELOPMENT_TEAM: 569WLL4Q5F
    MARKETING_VERSION: 2.6.2

packages:
  swift-markdown-ui:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.3.0"
  swift-math:
    url: https://github.com/mgriebling/SwiftMath
    from: "1.7.3"

schemes:
  CrossDashboard:
    build:
      targets:
        CrossDashboard: all
        CrossDashboardKit: [build]
        DashboardWidgetExtension: [build]
        MemosShareExtension: [build]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CrossDashboardTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:

  CrossDashboardKit:
    type: framework
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - CrossDashboard/Domain/Models.swift
      - CrossDashboard/Domain/WidgetDataStore.swift
      - CrossDashboard/Domain/TimerDeepLink.swift
      - CrossDashboard/Domain/PersistedPomodoroSession.swift
      - CrossDashboard/Domain/BackgroundServiceContract.swift
      - CrossDashboard/Data/Persistence/PersistenceController.swift
      - CrossDashboard/Data/Prefs/AppPreferences.swift
      - CrossDashboard/Data/Prefs/AppTimeZone.swift
      - CrossDashboard/Data/Prefs/KeychainStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crossdashboard.kit
        PRODUCT_NAME: CrossDashboardKit
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MACH_O_TYPE: staticlib
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""

  CrossDashboard:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: CrossDashboard
        excludes:
          - Domain/Models.swift
          - Domain/WidgetDataStore.swift
          - Domain/TimerDeepLink.swift
          - Domain/PersistedPomodoroSession.swift
          - Domain/BackgroundServiceContract.swift
          - Data/Persistence/PersistenceController.swift
          - Data/Prefs/AppPreferences.swift
          - Data/Prefs/AppTimeZone.swift
          - Data/Prefs/KeychainStore.swift
      - path: CrossDashboardAgent/group.com.crossdashboard.background-agent.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    info:
      path: CrossDashboard/Info.plist
      properties:
        CFBundleDisplayName: CrossDashboard
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: ""
        NSPrincipalClass: NSApplication
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - crossdashboard
            CFBundleURLName: com.crossdashboard.app
        NSCalendarsUsageDescription: "CrossDashboard accesses your calendars to display events."
        NSRemindersUsageDescription: "CrossDashboard manages your tasks."
        com.apple.developer.networking.wifi-info: false
        NSServices:
          - NSMenuItem:
              default: "Capture to Memos"
            NSMessage: captureToMemos
            NSPortName: CrossDashboard
            NSSendTypes:
              - public.utf8-plain-text
              - public.url
              - public.file-url
    entitlements:
      path: CrossDashboard/CrossDashboard.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.assets.pictures.read-write: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.keychain-access-groups:
          - "$(AppIdentifierPrefix)com.crossdashboard.app"
        com.apple.application-identifier: "$(AppIdentifierPrefix)com.crossdashboard.app"
        com.apple.security.application-groups:
          - 569WLL4Q5F.com.crossdashboard
          - group.com.crossdashboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crossdashboard.app
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - target: CrossDashboardKit
        embed: false
      - package: swift-markdown-ui
        product: MarkdownUI
      - package: swift-math
        product: SwiftMath
      - target: MemosShareExtension
        embed: true
      - target: DashboardWidgetExtension
        embed: true
      - target: CrossDashboardAgent
        embed: true
        link: false
        codeSign: true
        copy:
          destination: resources

  CrossDashboardAgent:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: CrossDashboardAgent
        excludes:
          - "*.plist"
          - "*.entitlements"
    info:
      path: CrossDashboardAgent/Info.plist
      properties:
        CFBundleDisplayName: CrossDashboard Background Agent
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSBackgroundOnly: true
    entitlements:
      path: CrossDashboardAgent/CrossDashboardAgent.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.assets.pictures.read-write: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - 569WLL4Q5F.com.crossdashboard
          - group.com.crossdashboard
        com.apple.security.keychain-access-groups:
          - "$(AppIdentifierPrefix)com.crossdashboard.app"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crossdashboard.app.background-agent
        PRODUCT_NAME: CrossDashboardAgent
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
    dependencies:
      - target: CrossDashboardKit
        embed: false

  MemosShareExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - MemosShareExtension
    info:
      path: MemosShareExtension/Info.plist
      properties:
        CFBundleDisplayName: MemosShareExtension
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: 1
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 10
    entitlements:
      path: MemosShareExtension/MemosShareExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.application-groups:
          - 569WLL4Q5F.com.crossdashboard
        com.apple.security.keychain-access-groups:
          - "$(AppIdentifierPrefix)com.crossdashboard.app"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crossdashboard.app.shareextension
        PRODUCT_NAME: MemosShareExtension
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - target: CrossDashboardKit
        embed: false

  DashboardWidgetExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - DashboardWidgetExtension
    info:
      path: DashboardWidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: DashboardWidget
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: DashboardWidgetExtension/DashboardWidgetExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - 569WLL4Q5F.com.crossdashboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crossdashboard.app.widget
        PRODUCT_NAME: DashboardWidgetExtension
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: CrossDashboardKit
        embed: false

  CrossDashboardTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - CrossDashboardTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crossdashboard.tests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: CrossDashboardKit
        embed: false
