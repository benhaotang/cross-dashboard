# Native GTK/Debian package (native-linux/). Builds .deb for amd64 and aarch64.
# Triggers: published release (attach .deb) or manual workflow_dispatch (artifacts only).
# Legacy filename kept so existing repo links to this workflow remain valid.

name: Build Linux Native (DEB)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Upstream deb version (e.g. 1.8.0). Defaults to 0.0.0~git<short>.'
        required: false
        default: ''

jobs:
  build:
    name: Native Linux .deb (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # deb_arch is the dpkg suffix (e.g. *_arm64.deb), distinct from marketing "aarch64".
          - arch: amd64
            deb_arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            deb_arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            U="${{ github.event.release.tag_name }}"
            U="${U#v}"
          elif [ -n "${{ inputs.version_name }}" ]; then
            U="${{ inputs.version_name }}"
          else
            U="0.0.0~git$(git rev-parse --short HEAD)"
          fi
          echo "upstream=$U" >> "$GITHUB_OUTPUT"

      - name: Set Debian changelog version
        working-directory: native-linux
        run: |
          FULL="${{ steps.ver.outputs.upstream }}-1"
          sed -i "1s|.*|cross-dashboard (${FULL}) unstable; urgency=medium|" debian/changelog

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debhelper build-essential fakeroot \
            meson ninja-build pkg-config g++ \
            libsqlite3-dev libglib2.0-dev libgtkmm-3.0-dev libhandy-1-dev libsoup-3.0-dev \
            nlohmann-json3-dev libsecret-1-dev libcmark-gfm-dev libcmark-gfm-extensions-dev \
            libwebkit2gtk-4.1-dev libnotify-dev libappindicator3-dev

      - name: Build binary .deb
        working-directory: native-linux
        run: dpkg-buildpackage -b -us -uc

      - name: Stage .deb for upload
        id: deb
        run: |
          set -euo pipefail
          UP="${{ steps.ver.outputs.upstream }}"
          ROOT="${GITHUB_WORKSPACE}"
          DARCH="${{ matrix.deb_arch }}"
          shopt -s nullglob
          # dpkg-buildpackage writes .deb files to the parent of the source tree (repo root).
          mapfile -t DEBS < <(ls -1 "${ROOT}/cross-dashboard"_*_"${DARCH}".deb 2>/dev/null || true)
          if [ "${#DEBS[@]}" -eq 0 ]; then
            echo "::error::No cross-dashboard_*_${DARCH}.deb in ${ROOT}"
            ls -la "${ROOT}" || true
            exit 1
          fi
          mkdir -p out
          LABEL="${{ matrix.arch }}"
          cp "${DEBS[0]}" "out/cross-dashboard-${UP}-${LABEL}.deb"
          echo "path=out/cross-dashboard-${UP}-${LABEL}.deb" >> "$GITHUB_OUTPUT"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: cross-dashboard-linux-${{ matrix.arch }}-${{ steps.ver.outputs.upstream }}
          path: ${{ steps.deb.outputs.path }}
          retention-days: 30

      - name: Attach .deb to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.deb.outputs.path }}
